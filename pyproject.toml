[project]
name = "kamaratudas"
version = "0.1.0"
description = "KamaraTudás – Hungarian internal knowledge assistant with verifiable source citations (MKIK AI Hackathon)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "anthropic>=0.39",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "fastembed>=0.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
